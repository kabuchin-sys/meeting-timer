<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a1a">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Meeting Timer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #eee;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      transition: background 0.5s ease;
    }

    .bg-default {
      background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0a0a1a 100%);
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 16px;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 8px 0 4px;
    }
    .header h1 {
      font-size: 1.1rem;
      color: #fff;
      letter-spacing: 3px;
      font-weight: 300;
    }
    .header h1 span {
      color: #ff6b6b;
      font-weight: 700;
    }

    /* View Toggle */
    .view-toggle {
      display: flex;
      gap: 2px;
      margin: 8px 0;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 3px;
    }
    .view-btn {
      flex: 1;
      padding: 8px;
      background: transparent;
      border: none;
      border-radius: 10px;
      color: #888;
      font-size: 0.85rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    .view-btn.active {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }

    /* Circular Timer */
    .circle-timer {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 16px auto;
    }
    .circle-timer svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }
    .circle-bg {
      fill: none;
      stroke: rgba(255,255,255,0.06);
      stroke-width: 8;
    }
    .circle-progress {
      fill: none;
      stroke: url(#timerGradient);
      stroke-width: 8;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.1s linear;
    }
    .circle-glow {
      fill: none;
      stroke: url(#timerGradient);
      stroke-width: 12;
      stroke-linecap: round;
      opacity: 0.2;
      filter: blur(6px);
      transition: stroke-dashoffset 0.1s linear;
    }

    .timer-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .timer-time {
      font-size: 3.8rem;
      font-weight: 200;
      font-variant-numeric: tabular-nums;
      color: #fff;
      letter-spacing: 2px;
      line-height: 1;
    }
    .timer-time.warning { color: #f5a623; }
    .timer-time.danger { color: #ff6b6b; animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .timer-round {
      font-size: 1.3rem;
      color: #ff6b6b;
      margin-top: 8px;
      font-weight: 600;
    }

    /* Checkpoint markers on circle */
    .cp-marker {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.3);
      transform: translate(-50%, -50%);
      transition: all 0.3s;
    }
    .cp-marker.passed {
      background: #ff6b6b;
      border-color: #ff6b6b;
      box-shadow: 0 0 10px rgba(255,107,107,0.6);
    }

    /* Bell Indicators */
    .bell-indicators {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 4px 0 12px;
      min-height: 20px;
    }
    .bell-card {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      transition: all 0.3s;
    }
    .bell-card.passed {
      background: rgba(255,107,107,0.15);
      border-color: rgba(255,107,107,0.4);
      box-shadow: 0 0 15px rgba(255,107,107,0.15);
    }
    .bell-card .bell-icon { width: 20px; height: 20px; opacity: 0.4; transition: all 0.3s; }
    .bell-card.passed .bell-icon { opacity: 1; animation: bellRing 0.5s ease-in-out; }
    .bell-card .bell-label { font-size: 0.75rem; color: #888; }
    .bell-card.passed .bell-label { color: #ff6b6b; }
    .bell-card .bell-count { display: flex; gap: 2px; }
    .bell-card .mini-bell { width: 12px; height: 12px; opacity: 0.3; }
    .bell-card.passed .mini-bell { opacity: 1; }

    @keyframes bellRing {
      0% { transform: rotate(0deg); }
      20% { transform: rotate(15deg); }
      40% { transform: rotate(-15deg); }
      60% { transform: rotate(10deg); }
      80% { transform: rotate(-10deg); }
      100% { transform: rotate(0deg); }
    }

    /* Chime animation overlay */
    .chime-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .chime-overlay.show { opacity: 1; }
    .chime-bell-big {
      width: 120px;
      height: 120px;
      animation: bellSwing 0.8s ease-in-out;
      filter: drop-shadow(0 0 30px rgba(255,215,0,0.6));
    }
    @keyframes bellSwing {
      0% { transform: rotate(0deg) scale(0.5); opacity: 0; }
      20% { transform: rotate(20deg) scale(1.1); opacity: 1; }
      40% { transform: rotate(-20deg) scale(1); }
      60% { transform: rotate(15deg); }
      80% { transform: rotate(-10deg); }
      100% { transform: rotate(0deg); opacity: 0; }
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: 12px 0;
    }
    .btn {
      padding: 14px 32px;
      border: none;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:active { transform: scale(0.95); }
    .btn-start {
      background: linear-gradient(135deg, #ff6b6b, #ee5a24);
      color: #fff;
      flex: 1;
      max-width: 200px;
      box-shadow: 0 6px 20px rgba(255,107,107,0.3);
    }
    .btn-pause {
      background: linear-gradient(135deg, #f5a623, #f78c1f);
      color: #fff;
      flex: 1;
      max-width: 200px;
      box-shadow: 0 6px 20px rgba(245,166,35,0.3);
    }
    .btn-reset {
      background: rgba(255,255,255,0.08);
      color: #aaa;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* ===== SETTINGS VIEW ===== */
    .settings-panel {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 20px;
      margin-top: 8px;
    }
    .settings-panel h2 {
      font-size: 0.9rem;
      color: #ff6b6b;
      margin-bottom: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .settings-panel h2 .icon-sm { width: 18px; height: 18px; }

    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .form-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .form-row span {
      color: #666;
      font-size: 0.85rem;
    }

    /* Number inputs - tel type for numeric keypad */
    input[type="tel"] {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      color: #fff;
      padding: 10px 12px;
      font-size: 1.1rem;
      width: 70px;
      text-align: center;
      -webkit-appearance: none;
      transition: border-color 0.3s;
    }
    input[type="tel"]:focus {
      outline: none;
      border-color: #ff6b6b;
      box-shadow: 0 0 10px rgba(255,107,107,0.2);
    }

    /* Checkpoints */
    .checkpoints { margin-top: 10px; }
    .checkpoint-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .checkpoint-item:last-child { border-bottom: none; }

    .cp-remove {
      background: rgba(255,107,107,0.15);
      border: none;
      color: #ff6b6b;
      font-size: 1rem;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 8px;
    }

    .btn-add-cp {
      width: 100%;
      padding: 12px;
      background: rgba(255,107,107,0.08);
      border: 1px dashed rgba(255,107,107,0.3);
      border-radius: 12px;
      color: #ff6b6b;
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 10px;
    }

    .cp-warning {
      color: #f5a623;
      font-size: 0.75rem;
      margin-top: 4px;
      display: none;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body class="bg-default">
  <div class="app">
    <div class="header">
      <h1><span>Meeting</span> Timer</h1>
    </div>

    <!-- View Toggle -->
    <div class="view-toggle">
      <div class="view-btn active" data-view="timer" onclick="switchView('timer')">タイマー</div>
      <div class="view-btn" data-view="settings" onclick="switchView('settings')">設定</div>
    </div>

    <!-- Timer View -->
    <div id="timerView">
      <div class="circle-timer">
        <svg viewBox="0 0 260 260">
          <defs>
            <linearGradient id="timerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#ff6b6b"/>
              <stop offset="50%" style="stop-color:#ee5a24"/>
              <stop offset="100%" style="stop-color:#f5a623"/>
            </linearGradient>
          </defs>
          <circle class="circle-bg" cx="130" cy="130" r="115"/>
          <circle class="circle-glow" id="circleGlow" cx="130" cy="130" r="115"
                  stroke-dasharray="722.6" stroke-dashoffset="0"/>
          <circle class="circle-progress" id="circleProgress" cx="130" cy="130" r="115"
                  stroke-dasharray="722.6" stroke-dashoffset="0"/>
        </svg>
        <div class="timer-center">
          <div class="timer-time" id="timerTime">05:00</div>
          <div class="timer-round" id="timerRound"></div>
        </div>
        <div id="cpMarkers"></div>
      </div>

      <div class="bell-indicators" id="cpIndicators"></div>

      <div class="controls">
        <button class="btn btn-reset" onclick="resetTimer()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px;"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          リセット
        </button>
        <button class="btn btn-start" id="btnStartPause" onclick="toggleTimer()">
          <svg id="iconPlay" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle;margin-right:4px;"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <span id="btnLabel">スタート</span>
        </button>
      </div>
    </div>

    <!-- Settings View -->
    <div id="settingsView" class="hidden">
      <div class="settings-panel">
        <h2>
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="#ff6b6b" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          タイマー設定
        </h2>
        <div class="form-group">
          <label>カウントダウン時間</label>
          <div class="form-row">
            <input type="tel" id="setMinutes" value="5" maxlength="2" inputmode="numeric" onfocus="this.select()" oninput="onTimerSettingChange()">
            <span>分</span>
            <input type="tel" id="setSeconds" value="0" maxlength="2" inputmode="numeric" onfocus="this.select()" oninput="onTimerSettingChange()">
            <span>秒</span>
          </div>
        </div>
        <div class="form-group">
          <label>繰り返し回数</label>
          <div class="form-row">
            <input type="tel" id="setRepeat" value="1" maxlength="2" inputmode="numeric" onfocus="this.select()">
            <span>回</span>
          </div>
        </div>

        <h2>
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="#ff6b6b" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          チェックポイント
        </h2>
        <div id="checkpointList" class="checkpoints"></div>
        <div class="cp-warning" id="cpWarning">設定時間を超えています</div>
        <button class="btn-add-cp" onclick="addCheckpoint()">+ チェックポイント追加</button>
      </div>
    </div>
  </div>

  <!-- Chime animation overlay -->
  <div class="chime-overlay" id="chimeOverlay">
    <svg class="chime-bell-big" viewBox="0 0 100 100">
      <defs>
        <linearGradient id="bellGold" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#ffd700"/>
          <stop offset="50%" style="stop-color:#ffb700"/>
          <stop offset="100%" style="stop-color:#ff9500"/>
        </linearGradient>
      </defs>
      <path d="M50 8 C50 8 52 12 52 12 C52 12 54 12 54 14 C62 18 68 28 68 40 C68 58 74 64 76 68 L24 68 C26 64 32 58 32 40 C32 28 38 18 46 14 C46 12 48 12 48 12 C48 12 50 8 50 8Z" fill="url(#bellGold)" stroke="#daa520" stroke-width="1"/>
      <ellipse cx="50" cy="68" rx="28" ry="4" fill="url(#bellGold)" stroke="#daa520" stroke-width="1"/>
      <circle cx="50" cy="78" r="5" fill="url(#bellGold)" stroke="#daa520" stroke-width="1"/>
      <ellipse cx="50" cy="10" rx="4" ry="3" fill="#daa520"/>
      <path d="M36 30 C36 30 42 26 50 26" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" stroke-linecap="round"/>
    </svg>
  </div>

  <script>
    // ---- Bell SVG ----
    function bellSVG(size = 24, color = '#ffd700') {
      return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" class="bell-icon">
        <path d="M50 12 C50 12 52 16 52 16 C52 16 54 16 54 18 C62 22 68 30 68 42 C68 58 74 64 76 68 L24 68 C26 64 32 58 32 42 C32 30 38 22 46 18 C46 16 48 16 48 16 C48 16 50 12 50 12Z" fill="${color}" opacity="0.9"/>
        <ellipse cx="50" cy="68" rx="28" ry="4" fill="${color}" opacity="0.9"/>
        <circle cx="50" cy="78" r="5" fill="${color}" opacity="0.9"/>
        <ellipse cx="50" cy="14" rx="4" ry="3" fill="${color}" opacity="0.7"/>
        <path d="M36 32 C36 32 42 28 50 28" stroke="rgba(255,255,255,0.4)" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>`;
    }
    function miniBellSVG(size = 14, color = '#ffd700') {
      return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" class="mini-bell">
        <path d="M50 12 C50 12 52 16 52 16 C54 16 54 18 54 18 C62 22 68 30 68 42 C68 58 74 64 76 68 L24 68 C26 64 32 58 32 42 C32 30 38 22 46 18 C46 16 48 16 48 16 L50 12Z" fill="${color}" opacity="0.85"/>
        <ellipse cx="50" cy="68" rx="28" ry="4" fill="${color}" opacity="0.85"/>
        <circle cx="50" cy="78" r="5" fill="${color}" opacity="0.85"/>
      </svg>`;
    }

    // ---- Audio (iOS compatible) ----
    let audioCtx = null;
    let bell1Buffer = null;
    let bell2Buffer = null;
    let bell1Raw = null;
    let bell2Raw = null;
    let audioReady = false;

    fetch('bell1.mp3').then(r => r.arrayBuffer()).then(b => { bell1Raw = b; });
    fetch('bell2.mp3').then(r => r.arrayBuffer()).then(b => { bell2Raw = b; });

    async function ensureAudioReady() {
      if (audioReady) return;
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }
      const silentBuf = audioCtx.createBuffer(1, 1, 22050);
      const silentSrc = audioCtx.createBufferSource();
      silentSrc.buffer = silentBuf;
      silentSrc.connect(audioCtx.destination);
      silentSrc.start(0);
      if (bell1Raw && !bell1Buffer) {
        bell1Buffer = await audioCtx.decodeAudioData(bell1Raw.slice(0));
      }
      if (bell2Raw && !bell2Buffer) {
        bell2Buffer = await audioCtx.decodeAudioData(bell2Raw.slice(0));
      }
      audioReady = true;
    }

    function playBuffer(buffer) {
      if (!buffer || !audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const source = audioCtx.createBufferSource();
      const gain = audioCtx.createGain();
      source.buffer = buffer;
      gain.gain.value = 1.0;
      source.connect(gain);
      gain.connect(audioCtx.destination);
      source.start(0);
    }

    function playChime(count = 1) {
      showChimeAnimation();
      for (let i = 0; i < count; i++) {
        setTimeout(() => playBuffer(bell1Buffer), i * 1500);
      }
    }

    function playEndChime() {
      showChimeAnimation();
      playBuffer(bell2Buffer);
    }

    function showChimeAnimation() {
      const overlay = document.getElementById('chimeOverlay');
      overlay.classList.remove('show');
      void overlay.offsetWidth;
      overlay.classList.add('show');
      setTimeout(() => overlay.classList.remove('show'), 900);
    }

    // ---- Background Color (blue -> green -> red) ----
    function updateBackground(pct) {
      // pct: 0 = start, 1 = end
      // 0.0 = blue, 0.5 = green, 1.0 = red
      let r, g, b;
      if (pct <= 0.5) {
        const t = pct / 0.5;
        r = Math.round(20 + t * 10);
        g = Math.round(40 + t * 140);
        b = Math.round(120 - t * 60);
      } else {
        const t = (pct - 0.5) / 0.5;
        r = Math.round(30 + t * 160);
        g = Math.round(180 - t * 150);
        b = Math.round(60 - t * 40);
      }
      const r2 = Math.round(r * 0.4);
      const g2 = Math.round(g * 0.4);
      const b2 = Math.round(b * 0.4);
      document.body.style.background = `linear-gradient(135deg, rgb(${r2},${g2},${b2}) 0%, rgb(${r},${g},${b}) 50%, rgb(${r2},${g2},${b2}) 100%)`;
      document.body.classList.remove('bg-default');
    }

    function resetBackground() {
      document.body.style.background = '';
      document.body.classList.add('bg-default');
    }

    // ---- State ----
    let timerState = 'stopped';
    let remainingMs = 0;
    let totalMs = 0;
    let currentRound = 1;
    let totalRounds = 1;
    let intervalId = null;
    let lastTick = 0;
    let checkpoints = [];
    let passedCheckpoints = new Set();
    const CIRCUMFERENCE = 2 * Math.PI * 115;

    // ---- Input Helpers ----
    function getVal(id) {
      return parseInt(document.getElementById(id).value) || 0;
    }

    function getTotalSettingSec() {
      return getVal('setMinutes') * 60 + getVal('setSeconds');
    }

    // Called when timer setting changes -> auto-update default checkpoint
    function onTimerSettingChange() {
      const totalSec = getTotalSettingSec();
      const cps = getCheckpointsFromUI();
      // If no checkpoints or only one default, auto-set to 3/4
      if (cps.length === 0 || (cps.length === 1 && cps[0]._auto)) {
        const cpSec = Math.floor(totalSec * 0.75);
        if (cpSec > 0) {
          renderCheckpoints([{ elapsedSec: cpSec, chimeCount: 1, _auto: true }]);
        }
      }
      // Validate existing checkpoints
      validateCheckpoints();
    }

    function validateCheckpoints() {
      const totalSec = getTotalSettingSec();
      const items = document.querySelectorAll('.checkpoint-item');
      let hasWarning = false;
      items.forEach(item => {
        const mins = parseInt(item.querySelector('.cp-min').value) || 0;
        const secs = parseInt(item.querySelector('.cp-sec').value) || 0;
        const cpSec = mins * 60 + secs;
        if (cpSec >= totalSec && totalSec > 0) {
          hasWarning = true;
          // Clamp to totalSec - 1
          const clamped = Math.max(1, totalSec - 1);
          item.querySelector('.cp-min').value = Math.floor(clamped / 60);
          item.querySelector('.cp-sec').value = clamped % 60;
        }
      });
      document.getElementById('cpWarning').style.display = hasWarning ? 'block' : 'none';
    }

    // ---- Settings ----
    function getSettings() {
      return {
        minutes: getVal('setMinutes'),
        seconds: getVal('setSeconds'),
        repeat: getVal('setRepeat') || 1,
        checkpoints: getCheckpointsFromUI()
      };
    }

    function applySettings(s) {
      document.getElementById('setMinutes').value = s.minutes;
      document.getElementById('setSeconds').value = s.seconds;
      document.getElementById('setRepeat').value = s.repeat;
      renderCheckpoints(s.checkpoints || []);
    }

    function getCheckpointsFromUI() {
      const items = document.querySelectorAll('.checkpoint-item');
      const cps = [];
      items.forEach(item => {
        const mins = parseInt(item.querySelector('.cp-min').value) || 0;
        const secs = parseInt(item.querySelector('.cp-sec').value) || 0;
        const chimes = parseInt(item.querySelector('.cp-chime').value) || 1;
        const elapsedSec = mins * 60 + secs;
        if (elapsedSec > 0) {
          cps.push({ elapsedSec, chimeCount: chimes });
        }
      });
      return cps.sort((a, b) => a.elapsedSec - b.elapsedSec);
    }

    // ---- Checkpoints UI ----
    function renderCheckpoints(cps) {
      const list = document.getElementById('checkpointList');
      list.innerHTML = '';
      cps.forEach((cp, i) => {
        const mins = Math.floor(cp.elapsedSec / 60);
        const secs = cp.elapsedSec % 60;
        const div = document.createElement('div');
        div.className = 'checkpoint-item';
        div.innerHTML = `
          ${bellSVG(18, '#ff6b6b')}
          <input type="tel" class="cp-min" maxlength="2" inputmode="numeric" value="${mins}" style="width:55px" onfocus="this.select()" oninput="validateCheckpoints()">
          <span>分</span>
          <input type="tel" class="cp-sec" maxlength="2" inputmode="numeric" value="${secs}" style="width:55px" onfocus="this.select()" oninput="validateCheckpoints()">
          <span>秒</span>
          <span style="margin-left:2px;">${bellSVG(14, '#ffd700')}</span>
          <input type="tel" class="cp-chime" maxlength="1" inputmode="numeric" value="${cp.chimeCount}" style="width:40px" onfocus="this.select()">
          <button class="cp-remove" onclick="removeCheckpoint(${i})">x</button>
        `;
        list.appendChild(div);
      });
    }

    function addCheckpoint() {
      const totalSec = getTotalSettingSec();
      const cps = getCheckpointsFromUI();
      const defaultSec = Math.max(1, Math.floor(totalSec * 0.75));
      cps.push({ elapsedSec: defaultSec, chimeCount: 1 });
      renderCheckpoints(cps);
    }

    function removeCheckpoint(idx) {
      const cps = getCheckpointsFromUI();
      cps.splice(idx, 1);
      renderCheckpoints(cps);
    }

    // ---- Timer Logic ----
    function startTimer() {
      const s = getSettings();
      totalMs = (s.minutes * 60 + s.seconds) * 1000;
      if (totalMs <= 0) return;

      totalRounds = s.repeat;
      checkpoints = s.checkpoints;

      if (timerState === 'stopped') {
        remainingMs = totalMs;
        currentRound = 1;
        passedCheckpoints.clear();
      }

      timerState = 'running';
      lastTick = Date.now();
      updateDisplay();
      updateButton();
      renderCpIndicators();

      intervalId = setInterval(() => {
        const now = Date.now();
        const delta = now - lastTick;
        lastTick = now;
        remainingMs -= delta;

        const elapsedMs = totalMs - remainingMs;
        const elapsedSec = Math.floor(elapsedMs / 1000);
        checkpoints.forEach((cp, i) => {
          const key = `${currentRound}-${i}`;
          if (elapsedSec >= cp.elapsedSec && !passedCheckpoints.has(key)) {
            passedCheckpoints.add(key);
            playChime(cp.chimeCount);
            updateCpIndicators();
          }
        });

        if (remainingMs <= 0) {
          remainingMs = 0;
          updateDisplay();
          playEndChime();

          if (currentRound < totalRounds) {
            currentRound++;
            remainingMs = totalMs;
            passedCheckpoints = new Set([...passedCheckpoints].filter(k => !k.startsWith(`${currentRound}-`)));
            renderCpIndicators();
          } else {
            clearInterval(intervalId);
            timerState = 'stopped';
            updateButton();
            return;
          }
        }

        updateDisplay();
      }, 50);
    }

    function pauseTimer() {
      clearInterval(intervalId);
      timerState = 'paused';
      updateButton();
    }

    function resetTimer() {
      clearInterval(intervalId);
      timerState = 'stopped';
      const s = getSettings();
      totalMs = (s.minutes * 60 + s.seconds) * 1000;
      remainingMs = totalMs;
      currentRound = 1;
      passedCheckpoints.clear();
      resetBackground();
      updateDisplay();
      updateButton();
      renderCpIndicators();
    }

    async function toggleTimer() {
      await ensureAudioReady();
      if (timerState === 'running') {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function updateDisplay() {
      const totalSec = Math.max(0, Math.ceil(remainingMs / 1000));
      const mins = Math.floor(totalSec / 60);
      const secs = totalSec % 60;
      const timeStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

      const el = document.getElementById('timerTime');
      el.textContent = timeStr;

      el.className = 'timer-time';
      if (timerState === 'running') {
        if (totalSec <= 10) el.className = 'timer-time danger';
        else if (totalSec <= 30) el.className = 'timer-time warning';
      }

      const roundEl = document.getElementById('timerRound');
      roundEl.textContent = totalRounds > 1 ? `ラウンド ${currentRound} / ${totalRounds}` : '';

      // Circular progress
      if (totalMs > 0) {
        const pct = remainingMs / totalMs;
        const offset = CIRCUMFERENCE * (1 - pct);
        document.getElementById('circleProgress').setAttribute('stroke-dashoffset', offset);
        document.getElementById('circleGlow').setAttribute('stroke-dashoffset', offset);

        // Background color change (blue -> green -> red)
        if (timerState === 'running') {
          updateBackground(1 - pct);
        }
      }

      updateCpMarkers();
    }

    function updateButton() {
      const btn = document.getElementById('btnStartPause');
      const label = document.getElementById('btnLabel');
      const icon = document.getElementById('iconPlay');
      if (timerState === 'running') {
        label.textContent = '一時停止';
        icon.innerHTML = '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>';
        btn.className = 'btn btn-pause';
      } else {
        label.textContent = timerState === 'paused' ? '再開' : 'スタート';
        icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
        btn.className = 'btn btn-start';
      }
    }

    // ---- Checkpoint indicators ----
    function renderCpIndicators() {
      const el = document.getElementById('cpIndicators');
      el.innerHTML = '';
      checkpoints.forEach((cp, i) => {
        const m = Math.floor(cp.elapsedSec / 60);
        const s = cp.elapsedSec % 60;
        const label = m > 0 ? `${m}:${String(s).padStart(2,'0')}` : `${s}秒`;
        const card = document.createElement('div');
        card.className = 'bell-card';
        card.id = `cp-card-${i}`;
        let bellIcons = '';
        for (let b = 0; b < cp.chimeCount; b++) bellIcons += miniBellSVG(14, '#ffd700');
        card.innerHTML = `
          ${bellSVG(20, '#ffd700')}
          <span class="bell-label">${label}</span>
          <span class="bell-count">${bellIcons}</span>
        `;
        el.appendChild(card);
      });
      updateCpIndicators();
    }

    function updateCpIndicators() {
      checkpoints.forEach((cp, i) => {
        const card = document.getElementById(`cp-card-${i}`);
        if (card) {
          const key = `${currentRound}-${i}`;
          card.className = passedCheckpoints.has(key) ? 'bell-card passed' : 'bell-card';
        }
      });
    }

    function updateCpMarkers() {
      const container = document.getElementById('cpMarkers');
      if (!container) return;
      container.innerHTML = '';
      if (totalMs <= 0) return;
      const cx = 130, cy = 130, r = 115;
      checkpoints.forEach((cp, i) => {
        const pct = (cp.elapsedSec * 1000) / totalMs;
        if (pct > 1) return;
        // Ring shrinks counter-clockwise from 12 o'clock
        // Marker at elapsed pct goes counter-clockwise from 12
        const angle = -Math.PI/2 - 2 * Math.PI * pct;
        const x = cx + r * Math.cos(angle);
        const y = cy + r * Math.sin(angle);
        const marker = document.createElement('div');
        marker.className = 'cp-marker';
        const key = `${currentRound}-${i}`;
        if (passedCheckpoints.has(key)) marker.classList.add('passed');
        marker.style.left = `${(x / 260) * 100}%`;
        marker.style.top = `${(y / 260) * 100}%`;
        container.appendChild(marker);
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ---- View Toggle ----
    function switchView(view) {
      document.getElementById('timerView').className = view === 'timer' ? '' : 'hidden';
      document.getElementById('settingsView').className = view === 'settings' ? '' : 'hidden';
      document.querySelectorAll('.view-btn').forEach(b => {
        b.className = b.dataset.view === view ? 'view-btn active' : 'view-btn';
      });
    }

    // ---- Init ----
    function init() {
      // Set default checkpoint at 3/4 of timer
      const totalSec = getTotalSettingSec();
      const cpSec = Math.floor(totalSec * 0.75);
      renderCheckpoints(cpSec > 0 ? [{ elapsedSec: cpSec, chimeCount: 1 }] : []);
      const s = getSettings();
      totalMs = (s.minutes * 60 + s.seconds) * 1000;
      remainingMs = totalMs;
      updateDisplay();
    }

    init();

    ['touchstart', 'click'].forEach(evt => {
      document.addEventListener(evt, () => ensureAudioReady(), { once: true });
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
